<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to Campus Lost & Found.">
  <title>Login · Campus Lost & Found</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand"><span class="brand-mark">LF</span><span>Campus Lost &amp; Found</span></div>
      <p class="eyebrow">SECURE CAMPUS ACCESS</p>
      <h1 id="loginTitle">Welcome back</h1>
      <p class="login-intro">Log in to report items, browse campus reports, and manage the reports you are allowed to access.</p>

      <form id="loginForm" class="report-form" novalidate>
        <label>Username *<input id="username" name="username" type="text" autocomplete="username" required placeholder="Enter username"></label>
        <label>Password *<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password"></label>
        <div id="loginMessage" class="form-message" role="alert" aria-live="assertive"></div>
        <button id="loginButton" class="button button-primary button-full" type="submit">Log in</button>
      </form>

      <div class="demo-accounts">
        <strong>Demo accounts</strong>
        <p><b>Student:</b> student1 / student123</p>
        <p><b>Admin:</b> admin / admin123</p>
      </div>
      <p class="login-note">For this academic demo, user accounts are stored in <code>data/users.txt</code>.</p>
    </section>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
